# Local Postgres for the extracted records (week 3). Port 5433 on the host, because 5432 is
# often taken by another Postgres. The same schema goes to RDS in week 4.
services:
  postgres:
    image: postgres:16-alpine
    container_name: caselaw-postgres
    environment:
      POSTGRES_USER: caselaw
      POSTGRES_PASSWORD: caselaw
      POSTGRES_DB: caselaw
    ports:
      - "5433:5432"
    volumes:
      - caselaw-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caselaw -d caselaw"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  caselaw-pgdata:
