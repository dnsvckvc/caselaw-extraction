[project]
name = "caselaw-extraction"
version = "0.1.0"
description = "Information extraction and citation graph over Swiss Federal Supreme Court decisions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "polars>=1.10",
    "pydantic>=2.9",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "regex>=2024.9",
    "dask[distributed]>=2024.10",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "networkx>=3.3",
    "pyvis>=0.3.2",
]

[project.optional-dependencies]
# The learned extractors and experiment tracking. The API image installs the core set only.
ml = [
    "spacy>=3.8",
    "transformers>=4.45",
    "torch>=2.5",
    "mlflow>=2.17",
    "scikit-learn>=1.5",
    "accelerate>=1.0",
    "sentencepiece>=0.2.2",
    "protobuf>=7.36.2",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.11",
]

[project.scripts]
caselaw = "caselaw_extraction.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caselaw_extraction"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "markdown>=3.11.2",
]
