# Build the API image, push it to ECR and restart the Fargate service. Runs after a green
# `ci` run on main, or by hand. Credentials come from the OIDC role that Terraform creates
# when `github_repo` is set (output `github_deploy_role_arn`); store its ARN as the repository
# variable AWS_DEPLOY_ROLE_ARN, the region as AWS_REGION and the API URL as API_URL.
name: deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency: deploy

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      CLUSTER: caselaw
      SERVICE: caselaw-api
      REPOSITORY: caselaw-api
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push (tags: git sha and latest)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:${GITHUB_SHA::7}" -t "$REGISTRY/$REPOSITORY:latest" .
          docker push --all-tags "$REGISTRY/$REPOSITORY"
      - name: Restart the service on the new image
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
      - name: Smoke test
        if: vars.API_URL != ''
        run: |
          curl -fsS "${{ vars.API_URL }}/health"
          curl -fsS "${{ vars.API_URL }}/statutes/top?limit=3" | head -c 400
